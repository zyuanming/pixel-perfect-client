name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate repository contracts
        run: python tools/validate-repo.py

      - name: Check Python syntax
        run: python -m py_compile tools/validate-repo.py tools/visual-diff/compare.py
